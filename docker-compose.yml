services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nexo:nexo@db:5432/nexo?sslmode=disable
      JWT_SECRET: cambia-este-secreto-en-produccion
      ALLOWED_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
